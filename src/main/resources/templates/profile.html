    <script>
        function showToast(event) {
            // 1. Prevent the form from refreshing the page
            if (event) event.preventDefault();

            const toast = document.getElementById('save-toast');
            
            // 2. Show the toast
            toast.style.display = 'block';

            // 3. Auto-hide after 3 seconds
            setTimeout(() => {
                hideToast();
            }, 3000);
        }

        function hideToast() {
            const toast = document.getElementById('save-toast');
            toast.style.animation = 'slideIn 0.4s ease reverse forwards';
            setTimeout(() => {
                toast.style.display = 'none';
                toast.style.animation = 'slideIn 0.4s ease forwards'; // Reset for next time
            }, 400);
        }
    </script>
